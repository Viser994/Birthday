# IAM SAML Learning Lab
server.port=8100

iamlab.app-name=IAM SAML Lab
iamlab.base-url=http://localhost:8100

# Service Provider (the app you protect)
iamlab.sp.entity-id=https://sp.iamlab.local/metadata
iamlab.sp.acs-url=http://localhost:8100/sp/acs
iamlab.sp.session-cookie=IAMLAB_SP_SESSION

# Identity Provider (issues SAML assertions)
iamlab.idp.entity-id=https://idp.iamlab.local/metadata
iamlab.idp.sso-url=http://localhost:8100/idp/sso
iamlab.idp.session-cookie=IAMLAB_IDP_SESSION

# Demo users live in the mock IdP (password is always "password")
iamlab.demo.hint=Use alice / password or bob / password at the IdP login
