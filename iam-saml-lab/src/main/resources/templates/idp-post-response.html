<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IdP — POST SAMLResponse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/lab.css}" />
</head>
<body>
  <div class="atmosphere idp" aria-hidden="true"></div>
  <div class="shell narrow">
    <header class="top">
      <div class="brand-mark">
        <span class="mark idp"></span>
        <div>
          <p class="eyebrow">Identity Provider</p>
          <h1 class="brand">Campus IdP</h1>
        </div>
      </div>
    </header>

    <section class="panel reveal">
      <h2>Step 5–6 — HTTP-POST binding to SP ACS</h2>
      <p class="lede" th:text="${explain}">Posting…</p>

      <dl class="meta">
        <div><dt>NameID</dt><dd th:text="${parsed.nameId}">email</dd></div>
        <div><dt>Status</dt><dd th:text="${parsed.status}">Success</dd></div>
        <div><dt>Audience</dt><dd th:text="${parsed.audience}">sp</dd></div>
        <div><dt>ACS</dt><dd th:text="${acsUrl}">acs</dd></div>
      </dl>

      <details class="xml-details" open>
        <summary>Inspect SAML Response XML</summary>
        <pre class="console" th:text="${responsePretty}">xml</pre>
      </details>

      <form id="samlPost" method="post" th:action="${acsUrl}">
        <input type="hidden" name="SAMLResponse" th:value="${samlResponse}" />
        <input type="hidden" name="RelayState" th:value="${relayState}" />
        <input type="hidden" name="flowId" th:value="${flowId}" />
        <button class="primary large" type="submit">POST Response to SP ACS →</button>
      </form>
      <p class="hint">In production this form auto-submits. Here you click so you can read the XML first.</p>
    </section>
  </div>
</body>
</html>
