# Ping AIC SaaS — learning lab
server.port=8088

# LOCAL = fully working passwordless lab without a Ping tenant
# AIC   = also call PingOne Advanced Identity Cloud journey APIs
pingaic.mode=LOCAL

# --- PingOne Advanced Identity Cloud (optional, for Mode=AIC) ---
# Example tenant: https://openam-xxxx.id.forgerock.io
pingaic.tenant-base-url=
pingaic.realm=alpha
pingaic.cookie-name=c1c5d76a75cd51d1
# Journey names configured in AIC admin console
pingaic.journeys.registration=PasswordlessRegistration
pingaic.journeys.login=PasswordlessLogin
# Service account / OAuth client for IDM provisioning (optional)
pingaic.idm.client-id=
pingaic.idm.client-secret=
pingaic.idm.scope=fr:idm:*

# Learning lab settings
pingaic.lab.app-name=Ping AIC SaaS
pingaic.lab.otp-ttl-seconds=300
pingaic.lab.magic-link-base-url=http://localhost:8088
